.form-check-input[type=&quot;radio&quot;] {

  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {

.form-range::-webkit-slider-runnable-track {

.form-range::-webkit-slider-thumb {

  width: 20px;
  height: 20px;

.form-range:focus-visible::-webkit-slider-thumb {

.form-range::-moz-range-track {
  height: 28px;

.form-range::-moz-range-thumb {
  width: 20px;

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

.form-range:disabled {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;deal-witness-growth-lanes&#x27;);
      const pathLayer = root.querySelector(&#x27;#dwl-path-layer&#x27;);
      const nodeLayer = root.querySelector(&#x27;#dwl-node-layer&#x27;);
      const talkLabel = root.querySelector(&#x27;#dwl-talk-label&#x27;);
      const talkTitle = root.querySelector(&#x27;#dwl-talk-title&#x27;);
      const currentSource = root.querySelector(&#x27;#dwl-current-source&#x27;);
      const currentDetail = root.querySelector(&#x27;#dwl-current-detail&#x27;);
      const flowSentence = root.querySelector(&#x27;#dwl-flow-sentence&#x27;);
      const recordCount = root.querySelector(&#x27;#dwl-record-count&#x27;);
      const pathCount = root.querySelector(&#x27;#dwl-path-count&#x27;);
      const densityNote = root.querySelector(&#x27;#dwl-density-note&#x27;);
      const progressFill = root.querySelector(&#x27;#dwl-progress-fill&#x27;);
      const playButton = root.querySelector(&#x27;#dwl-play&#x27;);
      const nextButton = root.querySelector(&#x27;#dwl-next&#x27;);
      const resetButton = root.querySelector(&#x27;#dwl-reset&#x27;);

      const laneX = { source: 78, decision: 254, risk: 469, promise: 682, money: 893 };
      const colors = { decision: &#x27;#2f7897&#x27;, risk: &#x27;#d96d58&#x27;, promise: &#x27;#7c69bc&#x27;, money: &#x27;#c99a30&#x27; };
      const sourceColors = { Teams: &#x27;#6554c0&#x27;, Email: &#x27;#3976b8&#x27;, SharePoint: &#x27;#168b8d&#x27;, Slack: &#x27;#3aa17e&#x27;, WhatsApp: &#x27;#42a86b&#x27;, Model: &#x27;#b7892f&#x27;, Document: &#x27;#68747e&#x27; };
      const paths = [
        { source:&#x27;Teams&#x27;, sourceLabel:&#x27;TEAMS&#x27;, context:&#x27;Microsoft Teams · credit call&#x27;, decision:&#x27;Release first draw?&#x27;, risks:[&#x27;No certificate&#x27;,&#x27;Budget unproven&#x27;], promises:[&#x27;Engineer certifies&#x27;,&#x27;Sponsor funds first&#x27;], money:[&#x27;$42M draw&#x27;] },
        { source:&#x27;Email&#x27;, sourceLabel:&#x27;EMAIL&#x27;, context:&#x27;Email · noise-work negotiation&#x27;, decision:&#x27;Accept mitigation scope?&#x27;, risks:[&#x27;Cost overrun&#x27;], promises:[&#x27;$18.6M earmark&#x27;,&#x27;Scope under contract&#x27;], money:[&#x27;$18.6M funded&#x27;] },
        { source:&#x27;SharePoint&#x27;, sourceLabel:&#x27;SP&#x27;, context:&#x27;SharePoint · permit register&#x27;, decision:&#x27;Sequence permits?&#x27;, risks:[&#x27;Opening delay&#x27;,&#x27;Approval conflict&#x27;], promises:[&#x27;Permit before works&#x27;], money:[&#x27;$11M reserve&#x27;] },
        { source:&#x27;Slack&#x27;, sourceLabel:&#x27;SLACK&#x27;, context:&#x27;Slack · deal-team discussion&#x27;, decision:&#x27;Use contingency?&#x27;, risks:[&#x27;Budget leakage&#x27;], promises:[&#x27;Lender consent&#x27;], money:[&#x27;Contingency locked&#x27;] },
        { source:&#x27;WhatsApp&#x27;, sourceLabel:&#x27;WA&#x27;, context:&#x27;WhatsApp · contractor exchange&#x27;, decision:&#x27;Grant site access?&#x27;, risks:[&#x27;Uninsured work&#x27;], promises:[&#x27;Evidence before entry&#x27;], money:[&#x27;Draw withheld&#x27;] },
        { source:&#x27;Model&#x27;, sourceLabel:&#x27;MODEL&#x27;, context:&#x27;Model · operating forecast&#x27;, decision:&#x27;Size revenue reserve?&#x27;, risks:[&#x27;Traffic downside&#x27;], promises:[&#x27;Quarterly top-up&#x27;], money:[&#x27;Reserve funded&#x27;] },
        { source:&#x27;Document&#x27;, sourceLabel:&#x27;DOC&#x27;, context:&#x27;Document · completion schedule&#x27;, decision:&#x27;Define completion?&#x27;, risks:[&#x27;Test ambiguity&#x27;], promises:[&#x27;Independent test&#x27;], money:[&#x27;Final draw&#x27;] },
        { source:&#x27;Teams&#x27;, sourceLabel:&#x27;TEAMS&#x27;, context:&#x27;Microsoft Teams · closing call&#x27;, decision:&#x27;Approve close?&#x27;, risks:[&#x27;Missing draft term&#x27;], promises:[&#x27;Correct v8&#x27;], money:[&#x27;$380M facility&#x27;] }
      ];

      const talk = [
        [&#x27;Beat 1 · the input arrives&#x27;,&#x27;A conversation becomes a decision.&#x27;,&#x27;Deal Witness preserves who said what, when, and where the source lives.&#x27;],
        [&#x27;Beat 2 · risks branch&#x27;,&#x27;The decision exposes what could go wrong.&#x27;,&#x27;One decision can create several risks. Each remains connected to the conversation that surfaced it.&#x27;],
        [&#x27;Beat 3 · people negotiate&#x27;,&#x27;Mitigation becomes a promise.&#x27;,&#x27;The team agrees how to control each risk. That agreement becomes a covenant, condition, or operating promise.&#x27;],
        [&#x27;Beat 4 · consequence&#x27;,&#x27;The promise governs money.&#x27;,&#x27;Only at the final lane do we show the dollars: what is funded, reserved, released, or withheld.&#x27;]
      ];

      let visibleCount = 0;
      let playing = false;
      let runToken = 0;

      function svgElement(name, attrs = {}) {
        const element = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; element.setAttribute(key, String(value)));
        return element;
      }

      function yPositions(count) {
        if (count &lt;= 1) return [275];
        const top = 92;
        const bottom = 462;
        return Array.from({length: count}, (_, index) =&gt; top + index * ((bottom - top) / (count - 1)));
      }

      function shortLines(label) {
        if (label.length &lt;= 17) return [label];
        const words = label.split(&#x27; &#x27;);
        let first = &#x27;&#x27;;
        let second = &#x27;&#x27;;
        words.forEach(word =&gt; {
          if ((first + &#x27; &#x27; + word).trim().length &lt;= 15 &amp;&amp; !second) first = (first + &#x27; &#x27; + word).trim();
          else second = (second + &#x27; &#x27; + word).trim();
        });
        return [first, second].filter(Boolean);
      }

      function addNode(kind, x, y, label, sourceType, isNew) {
        const group = svgElement(&#x27;g&#x27;, { class: `dwl-node${isNew ? &#x27; dwl-new-node&#x27; : &#x27;&#x27;}`, transform: `translate(${x} ${y})`, &#x27;data-kind&#x27;: kind });
        if (kind === &#x27;source&#x27;) {
          group.style.setProperty(&#x27;--dwl-source-color&#x27;, sourceColors[sourceType]);
          group.appendChild(svgElement(&#x27;rect&#x27;, { x:-31, y:-13, width:62, height:26 }));
        } else {
          group.style.setProperty(&#x27;--dwl-node-color&#x27;, colors[kind]);
          group.appendChild(svgElement(&#x27;circle&#x27;, { r: kind === &#x27;decision&#x27; ? 27 : 23 }));
        }
        const lines = shortLines(label);
        lines.forEach((line, index) =&gt; {
          const text = svgElement(&#x27;text&#x27;, { y: lines.length === 1 ? 3 : -2 + index * 10 });
          text.textContent = line;
          group.appendChild(text);
        });
        nodeLayer.appendChild(group);
      }

      function addCurve(x1, y1, x2, y2, segment, isNew, offset = 0) {
        const curve = svgElement(&#x27;path&#x27;, {
          class: `dwl-path${isNew ? &#x27; dwl-new-path&#x27; : &#x27;&#x27;}`,
          &#x27;data-segment&#x27;: segment,
          d: `M${x1},${y1} C${x1 + 55},${y1 + offset} ${x2 - 55},${y2 - offset} ${x2},${y2}`
        });
        pathLayer.appendChild(curve);
      }

      function render() {
        pathLayer.replaceChildren();
        nodeLayer.replaceChildren();
        const ys = yPositions(visibleCount);
        paths.slice(0, visibleCount).forEach((path, index) =&gt; {
          const y = ys[index];
          const isNew = index === visibleCount - 1;
          const riskYs = path.risks.length === 1 ? [y] : path.risks.map((_, riskIndex) =&gt; y + (riskIndex === 0 ? -16 : 16));
          const promiseYs = path.promises.length === 1 ? [y] : path.promises.map((_, promiseIndex) =&gt; y + (promiseIndex === 0 ? -15 : 15));
          addCurve(laneX.source + 31, y, laneX.decision - 27, y, &#x27;source&#x27;, isNew);
          path.risks.forEach((risk, riskIndex) =&gt; addCurve(laneX.decision + 27, y, laneX.risk - 23, riskYs[riskIndex], &#x27;decision-risk&#x27;, isNew, riskIndex ? 10 : -10));
          path.promises.forEach((promise, promiseIndex) =&gt; {
            const riskY = riskYs[Math.min(promiseIndex, riskYs.length - 1)];
            addCurve(laneX.risk + 23, riskY, laneX.promise - 23, promiseYs[promiseIndex], &#x27;risk-promise&#x27;, isNew, promiseIndex ? 8 : -8);
          });
          path.money.forEach((money, moneyIndex) =&gt; addCurve(laneX.promise + 23, promiseYs[Math.min(moneyIndex, promiseYs.length - 1)], laneX.money - 23, y, &#x27;promise-money&#x27;, isNew));
          addNode(&#x27;source&#x27;, laneX.source, y, path.sourceLabel, path.source, isNew);
          addNode(&#x27;decision&#x27;, laneX.decision, y, path.decision, path.source, isNew);
          path.risks.forEach((risk, riskIndex) =&gt; addNode(&#x27;risk&#x27;, laneX.risk, riskYs[riskIndex], risk, path.source, isNew));
          path.promises.forEach((promise, promiseIndex) =&gt; addNode(&#x27;promise&#x27;, laneX.promise, promiseYs[promiseIndex], promise, path.source, isNew));
          path.money.forEach(money =&gt; addNode(&#x27;money&#x27;, laneX.money, y, money, path.source, isNew));
        });
        const recordScale = visibleCount === 0 ? 0 : Math.round(432 * visibleCount / paths.length);
        recordCount.textContent = String(recordScale);
        pathCount.textContent = String(visibleCount);
        densityNote.textContent = visibleCount &lt; 2 ? &#x27;Scale · 1 decision path&#x27; : `Scale compressed · ${visibleCount} paths visible`;
        progressFill.style.width = `${100 * visibleCount / paths.length}%`;
        if (visibleCount &gt; 0) {
          const path = paths[visibleCount - 1];
          currentSource.textContent = path.context;
          const beatIndex = Math.min(3, Math.max(0, visibleCount - 1));
          talkLabel.textContent = talk[beatIndex][0];
          talkTitle.textContent = talk[beatIndex][1];
          currentDetail.textContent = talk[beatIndex][2];
          [...flowSentence.children].forEach((item, index) =&gt; item.dataset.active = String(index &lt;= beatIndex));
        }
      }

      const wait = milliseconds =&gt; new Promise(resolve =&gt; setTimeout(resolve, milliseconds));
      async function replay() {
        playing = true;
        const token = ++runToken;
        visibleCount = 0;
        render();
        playButton.textContent = &#x27;Playing&#x27;;
        for (let index = 1; index &lt;= paths.length; index += 1) {
          if (token !== runToken) break;
          visibleCount = index;
          render();
          await wait(index &lt;= 4 ? 900 : 620);
        }
        if (token === runToken) {
          playing = false;
          playButton.textContent = &#x27;Replay&#x27;;
          talkLabel.textContent = &#x27;The memory keeps growing&#x27;;
          talkTitle.textContent = &#x27;Every new source extends the causal graph.&#x27;;
          currentDetail.textContent = &#x27;The view compresses as evidence grows, while every decision, risk, promise, and monetary consequence remains connected to its receipts.&#x27;;
          [...flowSentence.children].forEach(item =&gt; item.dataset.active = &#x27;true&#x27;);
        }
      }

      playButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (playing) { runToken += 1; playing = false; playButton.textContent = &#x27;Replay&#x27;; }
        else replay();
      });
      nextButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        runToken += 1;
        playing = false;
        playButton.textContent = &#x27;Replay&#x27;;
        visibleCount = Math.min(paths.length, visibleCount + 1);
        render();
      });
      resetButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        runToken += 1;
        playing = false;
        playButton.textContent = &#x27;Replay&#x27;;
        visibleCount = 0;
        render();
      });

      render();
      setTimeout(replay, 350);
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
