          &lt;div class=&quot;dw-scale-row&quot;&gt;&lt;b id=&quot;dw-decision-count&quot;&gt;0&lt;/b&gt;&lt;span&gt;of 72 decisions mapped&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;dw-scale-row&quot;&gt;&lt;b&gt;13&lt;/b&gt;&lt;span&gt;stable clusters&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;dw-scale-row&quot;&gt;&lt;b&gt;24&lt;/b&gt;&lt;span&gt;investigation paths&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;dw-current&quot;&gt;
          &lt;p class=&quot;dw-current-label&quot; id=&quot;dw-current-label&quot;&gt;Selected receipt&lt;/p&gt;
          &lt;strong id=&quot;dw-current-title&quot;&gt;Financial model note · reserve sizing&lt;/strong&gt;
          &lt;p id=&quot;dw-current-copy&quot;&gt;A remembered decision reuses established downside, covenant, and reserve relationships.&lt;/p&gt;
          &lt;div class=&quot;dw-current-state&quot; id=&quot;dw-current-state&quot;&gt;&lt;i aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;Source-linked memory&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;
        &lt;div class=&quot;dw-controls&quot; aria-label=&quot;Memory replay controls&quot;&gt;
          &lt;button class=&quot;dw-control&quot; id=&quot;dw-replay&quot; data-main=&quot;true&quot; type=&quot;button&quot;&gt;Replay history&lt;/button&gt;
          &lt;button class=&quot;dw-control&quot; id=&quot;dw-next&quot; type=&quot;button&quot;&gt;Next document&lt;/button&gt;
          &lt;button class=&quot;dw-control&quot; id=&quot;dw-gap&quot; data-gap=&quot;true&quot; type=&quot;button&quot;&gt;Highlight the open gap&lt;/button&gt;
        &lt;/div&gt;
      &lt;/aside&gt;
    &lt;/div&gt;
    &lt;div class=&quot;dw-live&quot; id=&quot;dw-live&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;dw-memory-map&quot;);
      if (!root || root.dataset.ready === &quot;true&quot;) return;
      root.dataset.ready = &quot;true&quot;;

      const svgNS = &quot;http://www.w3.org/2000/svg&quot;;
      const edgeLayer = root.querySelector(&quot;#dw-edge-layer&quot;);
      const nodeLayer = root.querySelector(&quot;#dw-node-layer&quot;);
      const recordCount = root.querySelector(&quot;#dw-record-count&quot;);
      const decisionCount = root.querySelector(&quot;#dw-decision-count&quot;);
      const currentLabel = root.querySelector(&quot;#dw-current-label&quot;);
      const currentTitle = root.querySelector(&quot;#dw-current-title&quot;);
      const currentCopy = root.querySelector(&quot;#dw-current-copy&quot;);
      const currentState = root.querySelector(&quot;#dw-current-state&quot;);
      const live = root.querySelector(&quot;#dw-live&quot;);
      const replayButton = root.querySelector(&quot;#dw-replay&quot;);
      const nextButton = root.querySelector(&quot;#dw-next&quot;);
      const gapButton = root.querySelector(&quot;#dw-gap&quot;);

      const x = { input: 86, decision: 267, risk: 474, promise: 690, money: 892 };
      const totals = { input: 72, decision: 72, risk: 38, promise: 46, money: 20 };
      const steps = { input: 29, decision: 31, risk: 17, promise: 19, money: 7 };
      const top = 82;
      const height = 458;
      const baseDecisionCount = 64;
      const baseDownstream = { risk: 34, promise: 42, money: 18 };

      const decisionNames = [
        &quot;Reserve sizing&quot;, &quot;Draw sequence&quot;, &quot;Permit order&quot;, &quot;Completion test&quot;, &quot;Contingency use&quot;,
        &quot;Noise-work scope&quot;, &quot;Insurance evidence&quot;, &quot;Sponsor funding&quot;, &quot;Revenue sweep&quot;, &quot;Contractor access&quot;
      ];
      const riskNames = [
        &quot;Traffic downside&quot;, &quot;Uncertified works&quot;, &quot;Permit delay&quot;, &quot;Budget leakage&quot;, &quot;Scope drift&quot;,
        &quot;Cost overrun&quot;, &quot;Coverage lapse&quot;, &quot;Test ambiguity&quot;, &quot;Draft mismatch&quot;, &quot;Funding shortfall&quot;
      ];
      const promiseNames = [
        &quot;Reserve top-up&quot;, &quot;Engineer certificate&quot;, &quot;Consent before use&quot;, &quot;Sponsor funds first&quot;,
        &quot;Permit before works&quot;, &quot;Independent test&quot;, &quot;Evidence before entry&quot;, &quot;Quarterly review&quot;
      ];
      const moneyNames = [
        &quot;$42M first draw&quot;, &quot;$18.6M earmark&quot;, &quot;$11M reserve&quot;, &quot;$380M facility&quot;,
        &quot;Contingency locked&quot;, &quot;Final draw&quot;, &quot;Revenue reserve&quot;
      ];

      const incoming = [
        {
          source: &quot;Teams · credit committee call&quot;,
          copy: &quot;A new draw decision reuses the existing budget and certification controls.&quot;,
          decision: &quot;Stage first draw gate&quot;, risks: [2, 17], promises: [5, 20], money: [3]
        },
        {
          source: &quot;Email · counsel and engineer exchange&quot;,
          copy: &quot;The record adds one decision and expands the graph with a certification risk.&quot;,
          decision: &quot;Define certification evidence&quot;, risks: [34, 4], promises: [42, 5], money: [3]
        },
        {
          source: &quot;SharePoint · permit register v12&quot;,
          copy: &quot;Permit sequencing connects back into promises the team already negotiated.&quot;,
          decision: &quot;Lock permit sequence&quot;, risks: [2, 18], promises: [4, 21], money: [2]
        },
        {
          source: &quot;Model · base case update&quot;,
          copy: &quot;The revised forecast reuses the downside path and changes its reserve consequence.&quot;,
          decision: &quot;Re-size revenue reserve&quot;, risks: [0, 35], promises: [0, 43], money: [6, 18]
        },
        {
          source: &quot;Construction update · package 04&quot;,
          copy: &quot;One field update creates a decision but shares risks with earlier workstreams.&quot;,
          decision: &quot;Release early works&quot;, risks: [1, 5], promises: [6, 12], money: [0]
        },
        {
          source: &quot;Approval memo · technical conditions&quot;,
          copy: &quot;The approved record confirms who owns evidence and what can authorize funding.&quot;,
          decision: &quot;Approve evidence owner&quot;, risks: [34, 36], promises: [42, 44], money: [0]
        },
        {
          source: &quot;Meeting record · closing readiness&quot;,
          copy: &quot;The closing decision reuses the certification path and reveals a hollow promise.&quot;,
          decision: &quot;Prepare closing draft&quot;, risks: [34, 8], promises: [42, 10], money: [0, 3]
        },
        {
          source: &quot;Financing draft v7 · document check&quot;,
          copy: &quot;The draft omits a verified certification promise. The $42M draw path stays open for review.&quot;,
          decision: &quot;Hold first draw&quot;, risks: [34], promises: [42], money: [0], gap: true
        }
      ];

      const nodes = new Map();
      const edges = new Map();
      const paths = new Map();
      const nodePaths = new Map();
      let visibleBaseline = 0;
      let visibleIncoming = 0;
      let selectedPathId = null;
      let replayToken = 0;

      function element(name, attributes = {}) {
        const item = document.createElementNS(svgNS, name);
        Object.entries(attributes).forEach(([key, value]) =&gt; item.setAttribute(key, String(value)));
        return item;
      }

      function stableY(kind, index) {
        const total = totals[kind];
        const slot = (index * steps[kind] + (kind.length * 3)) % total;
        return top + (slot / Math.max(1, total - 1)) * height;
      }

      function nodeId(kind, index) { return `${kind}-${String(index).padStart(2, &quot;0&quot;)}`; }

      function labelFor(kind, index, override) {
        if (override) return override;
        if (kind === &quot;input&quot;) return `Record ${index + 1}`;
        if (kind === &quot;decision&quot;) return decisionNames[index % decisionNames.length];
        if (kind === &quot;risk&quot;) return riskNames[index % riskNames.length];
        if (kind === &quot;promise&quot;) return promiseNames[index % promiseNames.length];
        return moneyNames[index % moneyNames.length];
      }

      function addNode(kind, index, options = {}) {
        const id = nodeId(kind, index);
        if (nodes.has(id)) return nodes.get(id);
        const y = stableY(kind, index);
        const node = { id, kind, index, x: x[kind], y, label: labelFor(kind, index, options.label), gap: Boolean(options.gap) };
        const group = element(&quot;g&quot;, { class: `dw-node${options.isNew ? &quot; is-new&quot; : &quot;&quot;}`, &quot;data-kind&quot;: kind, &quot;data-node-id&quot;: id });
        const hit = element(&quot;circle&quot;, { class: &quot;dw-hit&quot;, cx: node.x, cy: node.y, r: 13 });
        let core;
        if (kind === &quot;input&quot;) core = element(&quot;rect&quot;, { class: &quot;dw-core&quot;, x: node.x - 2.5, y: node.y - 2.5, width: 5, height: 5, rx: 0.7 });
        else if (kind === &quot;promise&quot;) core = element(&quot;rect&quot;, { class: &quot;dw-core&quot;, x: node.x - 3, y: node.y - 3, width: 6, height: 6, rx: 0.8 });
        else if (kind === &quot;money&quot;) core = element(&quot;rect&quot;, { class: &quot;dw-core&quot;, x: node.x - 1.4, y: node.y - 5, width: 2.8, height: 10, rx: 1 });
        else core = element(&quot;circle&quot;, { class: &quot;dw-core&quot;, cx: node.x, cy: node.y, r: kind === &quot;decision&quot; ? 4 : 3.5 });
        const label = element(&quot;text&quot;, { class: &quot;dw-node-label&quot;, x: node.x + 9, y: node.y - 8, &quot;text-anchor&quot;: &quot;start&quot; });
        label.textContent = node.label;
        group.append(hit, core, label);
        group.addEventListener(&quot;pointerenter&quot;, () =&gt; {
          const candidates = nodePaths.get(id) || [];
          if (candidates.length) selectPath(candidates[candidates.length - 1], false);
        });
        group.addEventListener(&quot;click&quot;, () =&gt; {
          const candidates = nodePaths.get(id) || [];
          if (candidates.length) selectPath(candidates[candidates.length - 1], true);
        });
        node.element = group;
        nodeLayer.appendChild(group);
        nodes.set(id, node);
        return node;
      }

      function addEdge(fromId, toId, pathId, isNew) {
        const id = `${pathId}:${fromId}:${toId}`;
        if (edges.has(id)) return edges.get(id);
        const from = nodes.get(fromId);
        const to = nodes.get(toId);
        const bend = ((from.index * 11 + to.index * 7) % 19) - 9;
        const span = Math.max(44, (to.x - from.x) * 0.38);
        const path = element(&quot;path&quot;, {
          class: `dw-edge${isNew ? &quot; is-new&quot; : &quot;&quot;}`,
          d: `M${from.x},${from.y} C${from.x + span},${from.y + bend} ${to.x - span},${to.y - bend} ${to.x},${to.y}`,
          &quot;data-path-id&quot;: pathId
        });
        edgeLayer.appendChild(path);
        const edge = { id, pathId, fromId, toId, element: path };
        edges.set(id, edge);
        return edge;
      }

      function registerNodePath(id, pathId) {
        if (!nodePaths.has(id)) nodePaths.set(id, []);
        nodePaths.get(id).push(pathId);
      }

      function buildPath(index, spec, isNew) {
        const pathId = `path-${index}`;
        if (paths.has(pathId)) return paths.get(pathId);
        const input = addNode(&quot;input&quot;, index, { isNew });
        const decision = addNode(&quot;decision&quot;, index, { isNew, label: spec.decision });
        const riskNodes = spec.risks.map((item) =&gt; addNode(&quot;risk&quot;, item, { isNew: isNew &amp;&amp; item &gt;= baseDownstream.risk }));
        const promiseNodes = spec.promises.map((item) =&gt; addNode(&quot;promise&quot;, item, { isNew: isNew &amp;&amp; item &gt;= baseDownstream.promise, gap: Boolean(spec.gap &amp;&amp; item === 42) }));
        const moneyNodes = spec.money.map((item) =&gt; addNode(&quot;money&quot;, item, { isNew: isNew &amp;&amp; item &gt;= baseDownstream.money }));
        if (spec.gap) promiseNodes.forEach((node) =&gt; { node.gap = true; node.element.classList.add(&quot;is-gap&quot;); });
        const pathNodes = [input, decision, ...riskNodes, ...promiseNodes, ...moneyNodes];
        const pathEdges = [];
        pathEdges.push(addEdge(input.id, decision.id, pathId, isNew));
        riskNodes.forEach((risk) =&gt; pathEdges.push(addEdge(decision.id, risk.id, pathId, isNew)));
        promiseNodes.forEach((promise, item) =&gt; pathEdges.push(addEdge(riskNodes[item % riskNodes.length].id, promise.id, pathId, isNew)));
        moneyNodes.forEach((money, item) =&gt; pathEdges.push(addEdge(promiseNodes[item % promiseNodes.length].id, money.id, pathId, isNew)));
        const record = { id: pathId, index, spec, nodes: pathNodes, edges: pathEdges.filter(Boolean) };
        pathNodes.forEach((node) =&gt; registerNodePath(node.id, pathId));
        paths.set(pathId, record);
        return record;
      }

      function baselineSpec(index) {
        const firstRisk = (index * 7 + 3) % baseDownstream.risk;
        const secondRisk = (index * 11 + 9) % baseDownstream.risk;
        const firstPromise = (firstRisk * 5 + index) % baseDownstream.promise;
        const secondPromise = (secondRisk * 3 + index) % baseDownstream.promise;
        return {
          source: [&quot;Meeting record&quot;, &quot;Email&quot;, &quot;Technical report&quot;, &quot;Model note&quot;, &quot;Counsel markup&quot;, &quot;Approval memo&quot;][index % 6] + ` · record ${index + 1}`,
          copy: &quot;A historical decision remains connected to the risks, promises, and monetary consequences it changed.&quot;,
          decision: decisionNames[index % decisionNames.length],
          risks: index % 3 === 0 ? [firstRisk, secondRisk] : [firstRisk],
          promises: index % 4 === 0 ? [firstPromise, secondPromise] : [firstPromise],
          money: [(firstPromise * 7 + index) % baseDownstream.money]
        };
      }

      function updateSelection(pathId) {
        const selected = paths.get(pathId);
        if (!selected) return;
        nodes.forEach((node) =&gt; node.element.classList.remove(&quot;is-related&quot;));
        edges.forEach((edge) =&gt; edge.element.classList.remove(&quot;is-related&quot;, &quot;is-gap&quot;));
        selected.nodes.forEach((node) =&gt; node.element.classList.add(node.gap &amp;&amp; selected.spec.gap ? &quot;is-gap&quot; : &quot;is-related&quot;));
        selected.edges.forEach((edge) =&gt; edge.element.classList.add(selected.spec.gap ? &quot;is-gap&quot; : &quot;is-related&quot;));
      }

      function selectPath(pathId, announce) {
        const selected = paths.get(pathId);
        if (!selected) return;
        selectedPathId = pathId;
        updateSelection(pathId);
        currentLabel.textContent = selected.spec.gap ? &quot;Open gap · verified receipt&quot; : &quot;Selected receipt&quot;;
        currentTitle.textContent = selected.spec.source;
        currentCopy.textContent = selected.spec.copy;
        currentState.dataset.state = selected.spec.gap ? &quot;gap&quot; : &quot;linked&quot;;
        currentState.querySelector(&quot;span&quot;).textContent = selected.spec.gap ? &quot;Hollow path · hold for review&quot; : &quot;Source-linked memory&quot;;
        if (announce) live.textContent = `${selected.spec.source}. ${selected.spec.copy}`;
      }

      function addIncoming(index, announce) {
        if (index &gt;= incoming.length) return null;
        const record = buildPath(baseDecisionCount + index, incoming[index], true);
        visibleIncoming = Math.max(visibleIncoming, index + 1);
        decisionCount.textContent = String(baseDecisionCount + visibleIncoming);
        recordCount.textContent = String(Math.round(432 * (baseDecisionCount + visibleIncoming) / totals.decision));
        selectPath(record.id, announce);
        return record;
      }

      function addBaseline(index, announce) {
        const record = buildPath(index, baselineSpec(index), true);
        visibleBaseline = Math.max(visibleBaseline, index + 1);
        decisionCount.textContent = String(visibleBaseline);
        recordCount.textContent = String(Math.round(432 * visibleBaseline / totals.decision));
        if (announce) selectPath(record.id, false);
        return record;
      }

      function clearGraph() {
        edgeLayer.replaceChildren();
        nodeLayer.replaceChildren();
        nodes.clear();
        edges.clear();
        paths.clear();
        nodePaths.clear();
        visibleBaseline = 0;
        visibleIncoming = 0;
        selectedPathId = null;
        decisionCount.textContent = &quot;0&quot;;
        recordCount.textContent = &quot;0&quot;;
        currentLabel.textContent = &quot;Memory forming&quot;;
        currentTitle.textContent = &quot;Scanning synthetic deal records&quot;;
        currentCopy.textContent = &quot;Each document adds a tiny decision mark. Its links reinforce or extend findings already in institutional memory.&quot;;
        currentState.dataset.state = &quot;linked&quot;;
        currentState.querySelector(&quot;span&quot;).textContent = &quot;Evidence arriving over time&quot;;
      }

      function resetWeek() {
        replayToken += 1;
        for (let index = 0; index &lt; incoming.length; index += 1) {
          const pathId = `path-${baseDecisionCount + index}`;
          const record = paths.get(pathId);
          if (!record) continue;
          record.edges.forEach((edge) =&gt; { edge.element.remove(); edges.delete(edge.id); });
          record.nodes.forEach((node) =&gt; {
            const stillUsed = [...paths.values()].some((candidate) =&gt; candidate.id !== pathId &amp;&amp; candidate.nodes.some((item) =&gt; item.id === node.id));
            if (!stillUsed) { node.element.remove(); nodes.delete(node.id); nodePaths.delete(node.id); }
            else nodePaths.set(node.id, (nodePaths.get(node.id) || []).filter((item) =&gt; item !== pathId));
          });
          paths.delete(pathId);
        }
        visibleIncoming = 0;
        decisionCount.textContent = String(baseDecisionCount);
        selectPath(&quot;path-63&quot;, false);
      }

      function wait(ms) { return new Promise((resolve) =&gt; setTimeout(resolve, ms)); }

      async function replayHistory() {
        const token = ++replayToken;
        clearGraph();
        replayButton.textContent = &quot;Building memory&quot;;
        replayButton.disabled = true;
        nextButton.disabled = true;
        for (let index = 0; index &lt; baseDecisionCount; index += 1) {
          if (token !== replayToken) break;
          addBaseline(index, index &lt; 10 || index % 6 === 5 || index === baseDecisionCount - 1);
          await wait(index &lt; 12 ? 155 : 72);
        }
        if (token === replayToken) {
          replayButton.textContent = &quot;Replay history&quot;;
          replayButton.disabled = false;
          nextButton.disabled = false;
          selectPath(&quot;path-63&quot;, false);
          live.textContent = &quot;Nine months of synthetic memory mapped. Add the closing-week documents one at a time.&quot;;
        }
      }

      function revealAllIncoming() {
        while (visibleIncoming &lt; incoming.length) addIncoming(visibleIncoming, false);
      }

      replayButton.addEventListener(&quot;click&quot;, replayHistory);
      nextButton.addEventListener(&quot;click&quot;, () =&gt; {
        replayToken += 1;
        replayButton.textContent = &quot;Replay history&quot;;
        replayButton.disabled = false;
        nextButton.disabled = false;
        if (visibleIncoming &lt; incoming.length) addIncoming(visibleIncoming, true);
        else selectPath(&quot;path-71&quot;, true);
      });
      gapButton.addEventListener(&quot;click&quot;, () =&gt; {
        replayToken += 1;
        replayButton.textContent = &quot;Replay history&quot;;
        replayButton.disabled = false;
        nextButton.disabled = false;
        while (visibleBaseline &lt; baseDecisionCount) addBaseline(visibleBaseline, false);
        revealAllIncoming();
        selectPath(&quot;path-71&quot;, true);
      });

      replayHistory();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
